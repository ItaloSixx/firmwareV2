; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = LVGL-320-480
default_envs = LVGL-320-480
boards_dir = boards
data_dir = littlefs
lib_dir = libraries
src_dir = src

[libraries]

[com]
platform = espressif32@6.6.0
board = esp32s3dev
monitor_filters = esp32_exception_decoder
framework = espidf
build_type = release
board_build.filesystem = littlefs
build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -I./src
    -Wno-error=comment
    -Wno-error=unused-variable
    -Wno-error=unused-const-variable
    -Os
    -DCORE_DEBUG_LEVEL=0
lib_deps = 


[env:LVGL-320-480]
platform = ${com.platform}
board = 320x480
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
lib_deps = 
build_flags = 
	${com.build_flags}
	-DCONFIG_FREERTOS_ASSERT_ON_UNTESTED_FUNCTION=n
	-Wno-error
board_build.partitions = partitions_custom.csv
